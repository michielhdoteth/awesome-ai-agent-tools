# CodeRabbit configuration
#
# CodeRabbit is a GitHub App, not a workflow action. Install it once at
# https://github.com/apps/coderabbitai and it reviews PRs automatically.
# This file tunes what it looks at for a catalog repository.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  # The readmes are generated by scripts/generate-readme.js from the catalogs,
  # so reviewing them wastes attention and produces noise.
  path_filters:
    - '!readme.md'
    - '!*/README.md'
  path_instructions:
    - path: '*/catalog.json'
      instructions: >-
        This is a curated catalog. Check that new entries have a unique
        lowercase kebab-case id, a category that already exists in the file,
        a one-line description ending in a period, and a source link that
        resolves to a real, non-archived repository. Flag entries that
        duplicate an existing source repo or that look like marketing copy
        rather than an objective description. Do not ask for the header
        totals or category counts to be updated by hand; scripts/
        sync-catalog-metadata.js regenerates them.
    - path: 'scripts/*.js'
      instructions: >-
        Node 20 CommonJS, no dependencies. Keep the readme output
        deterministic and pipe-aligned so awesome-lint passes.
chat:
  auto_reply: true
