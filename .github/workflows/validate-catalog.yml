name: Validate Catalog Files

# pull_request_target, not pull_request: fork PRs run in an `action_required`
# state under pull_request and need a maintainer to approve each run, which
# shows contributors a red X through no fault of their own. PR Bot already uses
# this pattern successfully.
#
# Safety: pull_request_target runs with the base repo's token, so we must NOT
# execute or check out the fork's code. We check out the trusted base, then
# overlay only the PR's catalog.json data files, which are parsed as JSON.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '**/catalog.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay PR catalog files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          git fetch origin "refs/pull/${PR_NUM}/head:pr-head"
          files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}/files" \
            --jq '.[].filename' | grep -E 'catalog\.json$' || true)
          if [ -z "$files" ]; then
            echo "No catalog.json files changed in this PR."
          fi
          for f in $files; do
            echo "Overlaying $f from PR head"
            git checkout pr-head -- "$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate catalogs
        id: validate
        run: |
          {
            echo "## Catalog Validation Results"
            echo ""
            echo '```'
            node scripts/validate-catalogs.js 2>&1 || true
            echo '```'
            echo ""
            if node scripts/validate-catalogs.js > /dev/null 2>&1; then
              echo "**RESULT: PASSED**"
              echo "passed=true" >> "$GITHUB_OUTPUT"
            else
              echo "**RESULT: FAILED**"
              echo "passed=false" >> "$GITHUB_OUTPUT"
            fi
          } > results.md
          cat results.md

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('results.md')) return;
            const body = fs.readFileSync('results.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Catalog Validation Results')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail when catalogs are invalid
        if: steps.validate.outputs.passed != 'true'
        run: |
          echo "::error::Catalog validation failed. See the validation comment on this PR."
          exit 1
