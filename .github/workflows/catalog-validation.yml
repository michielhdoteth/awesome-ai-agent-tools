name: Safe Catalog Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: catalog-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-validation:
    name: catalog-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify README generation succeeds
        run: node .github/scripts/generate-readme.js

      - name: Validate catalog JSON syntax
        run: |
          for f in */catalog.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Validate catalog entries
        run: node .github/scripts/validate-catalogs.js
