name: Safe Catalog Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: catalog-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-validation:
    name: catalog-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Verify README generation succeeds
        run: node .github/scripts/generate-readme.js

      - name: Validate catalog JSON syntax
        run: |
          for f in */catalog.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Validate catalog entries
        run: node .github/scripts/validate-catalogs.js
