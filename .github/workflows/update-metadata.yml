name: Update Metadata

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update star counts from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const ROOT = process.cwd();
          const catalogs = ['skills', 'mcps', 'loops', 'subagents', 'hooks', 'plugins', 'prompts', 'tools'];
          const SLUG_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
          const GH_URL_RE = /github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)/;
          
          async function fetchStars(owner, repo) {
            try {
              const res = await fetch('https://api.github.com/repos/' + owner + '/' + repo, {
                headers: { 'Authorization': 'token ' + process.env.GITHUB_TOKEN }
              });
              if (!res.ok) return null;
              const data = await res.json();
              return data.stargazers_count || null;
            } catch { return null; }
          }
          
          function repoSlug(entry) {
            for (const f of ['source', 'sourceRepo', 'repo']) {
              const v = entry[f];
              if (typeof v === 'string' && SLUG_RE.test(v.trim())) return v.trim();
            }
            for (const f of ['github', 'githubUrl', 'url', 'sourceUrl', 'repository']) {
              const v = entry[f];
              if (typeof v === 'string') {
                const m = v.match(GH_URL_RE);
                if (m) return m[1] + '/' + m[2];
              }
            }
            if (typeof entry.websiteUrl === 'string') {
              const m = entry.websiteUrl.match(GH_URL_RE);
              if (m) return m[1] + '/' + m[2];
            }
            return null;
          }
          
          async function updateCatalog(name) {
            const filePath = path.join(ROOT, name, 'catalog.json');
            if (!fs.existsSync(filePath)) return;
            
            const raw = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            const arrKey = Object.keys(raw).find(k => Array.isArray(raw[k]));
            if (!arrKey) return;
            
            let updated = 0;
            let skipped = 0;
            for (const entry of raw[arrKey]) {
              const slug = repoSlug(entry);
              if (!slug) { skipped++; continue; }
              
              const parts = slug.split('/');
              const stars = await fetchStars(parts[0], parts[1]);
              if (stars !== null && stars !== entry.stars) {
                entry.stars = stars;
                updated++;
              }
              
              // Rate limit: 1 request per second
              await new Promise(r => setTimeout(r, 1100));
            }
            
            if (updated > 0) {
              fs.writeFileSync(filePath, JSON.stringify(raw, null, 2) + '\n');
              console.log(name + ': updated ' + updated + ' star counts (' + skipped + ' entries without a GitHub repo)');
            } else {
              console.log(name + ': no changes (' + skipped + ' entries without a GitHub repo)');
            }
          }
          
          (async () => {
            for (const cat of catalogs) {
              await updateCatalog(cat);
            }
          })();
          "

      - name: Regenerate README
        run: node .github/scripts/generate-readme.js

      - name: Check for changes
        id: diff
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update star counts and regenerate README [skip ci]"
          git push
